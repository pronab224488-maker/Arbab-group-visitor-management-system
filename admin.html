<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Visitor Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="main-container" style="max-width: 800px;">
        
        <div class="header-section">
            <div class="logo-badge"><i class="fa-solid fa-user-shield"></i></div>
            <h1>অ্যাডমিন কন্ট্রোল প্যানেল</h1>
            <p>ডিপার্টমেন্ট ম্যানেজমেন্ট এবং ভিজিটর লগ পর্যবেক্ষণ</p>
        </div>

        <!-- Department Add & Manage Section -->
        <div class="admin-section" style="background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 16px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1);">
            <h3 style="margin-bottom: 15px; font-size: 18px;"><i class="fa-solid fa-sitemap"></i> নতুন ডিপার্টমেন্ট যোগ করুন</h3>
            <form id="departmentForm" style="display: flex; gap: 10px;">
                <input type="text" id="deptName" placeholder="ডিপার্টমেন্টের নাম লিখুন (যেমন: IT, HR)" required style="flex: 1;">
                <button type="submit" class="submit-action-btn" style="width: auto; padding: 0 20px;">যোগ করুন</button>
            </form>

            <h4 style="margin: 20px 0 10px 0; font-size: 16px;">বর্তমান ডিপার্টমেন্টসমূহ:</h4>
            <div id="dept-list" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Dynamic Department List with Edit/Delete -->
            </div>
        </div>

        <!-- Link back to Visitor Portal -->
        <div style="text-align: center; background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
            <h3 style="margin-bottom: 10px;">ভিজিটর পোর্টাল</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">ভিজিটর চেক-ইন পেজে যাওয়ার জন্য নিচের লিংকে ক্লিক করুন</p>
            <a href="index.html" class="capture-action-btn" style="display: inline-block; text-decoration: none;">ভিজিটর পেজ খুলুন</a>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
